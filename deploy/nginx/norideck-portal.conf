# NoriDeck 포털 (정적 사이트) — Rocky Linux 의 dnf nginx 용 server 블록
# 설치: deploy/install.sh 가 /etc/nginx/conf.d/norideck-portal.conf 로 복사한다
# 앞단 L7 스위치가 HTTPS 를 끝내고 이 서버 :8080 으로 넘긴다 (같은 VM 에 다른 서비스가 8080 을 쓰면 포트를 바꾼다)
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /opt/norideck-portal/site;
    index index.html;
    charset utf-8;
    server_tokens off;
    # L7 뒤에서 http://...:8080 으로 리다이렉트하지 않도록 상대 주소로
    absolute_redirect off;

    access_log /var/log/nginx/norideck-portal.access.log;
    error_log  /var/log/nginx/norideck-portal.error.log warn;

    include /etc/nginx/norideck-portal-headers.inc;

    # /download → download.html (확장자 없는 주소)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    # 예전 React 버전 주소
    location = /releases { return 301 /download#history; }
    location ^~ /admin   { return 301 /; }

    # 저장소 파일 중 사이트가 아닌 것은 root 밖에 있어 애초에 안 보인다. 숨김 파일만 한 번 더 막는다
    location ~ /\. { return 404; }

    error_page 404 /404.html;

    # 이미지는 길게, CSS·JS 는 짧게 (파일 이름에 해시가 없으므로)
    location ^~ /assets/img/ {
        expires 7d;
        add_header Cache-Control "public";
        include /etc/nginx/norideck-portal-headers.inc;
    }
    location ~* \.(css|js)$ {
        expires 10m;
    }

    gzip on;
    gzip_types text/css application/javascript text/javascript image/svg+xml;
}
